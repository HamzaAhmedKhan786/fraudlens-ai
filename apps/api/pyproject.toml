[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fraudlens-api"
version = "0.1.0"
description = "FraudLens AI investigation control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "aiokafka>=0.12,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "openai>=1.99,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fraudlens"]
