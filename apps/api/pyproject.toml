[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fraudlens-api"
version = "0.1.0"
description = "FraudLens AI investigation control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "aiokafka>=0.12,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "openai>=1.99,<2",
  "python-multipart>=0.0.20,<1",
  "filetype>=1.2,<2",
  "minio>=7.2,<8",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "pillow>=11,<13",
  "httpx>=0.28,<1",
  "cryptography>=45,<47",
  "pytesseract>=0.3.13,<1",
  "pdf2image>=1.17,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fraudlens"]
