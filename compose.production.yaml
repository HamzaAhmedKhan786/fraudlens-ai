name: fraudlens-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: fraudlens
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fraudlens]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafka_data:/var/lib/kafka/data]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
    volumes: [minio_data:/data]

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: [clamav_data:/var/lib/clamav]
    healthcheck:
      test: [CMD-SHELL, clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s

  api: &api
    build: {context: ., dockerfile: apps/api/Dockerfile}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OBJECT_STORAGE_ENDPOINT: minio:9000
      CLAMAV_HOST: clamav
    depends_on:
      postgres: {condition: service_healthy}
      clamav: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 12
    ports: [127.0.0.1:8000:8000]

  evidence-worker:
    <<: *api
    command: [python, -m, fraudlens.worker]
    ports: []
    healthcheck: {disable: true}
    depends_on: {api: {condition: service_healthy}}

  retention-worker:
    <<: *api
    command: [python, -m, fraudlens.retention]
    ports: []
    healthcheck: {disable: true}
    depends_on: {api: {condition: service_healthy}}

  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      FRAUDLENS_API_URL: http://api:8000/api/v1
    depends_on: {api: {condition: service_healthy}}
    ports: [127.0.0.1:3000:3000]

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  clamav_data:
