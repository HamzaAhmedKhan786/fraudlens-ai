name: fraudlens

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fraudlens
      POSTGRES_PASSWORD: fraudlens
      POSTGRES_DB: fraudlens
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  kafka:
    image: apache/kafka:4.0.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: fraudlens
      MINIO_ROOT_PASSWORD: fraudlens-dev-password
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    volumes: ["clamav_data:/var/lib/clamav"]
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://fraudlens:fraudlens@postgres:5432/fraudlens
      API_KEY: ${API_KEY:-fraudlens-compose-dev-key}
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROCESSING_INLINE: "false"
      OBJECT_STORAGE_BACKEND: minio
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: fraudlens
      OBJECT_STORAGE_SECRET_KEY: fraudlens-dev-password
      OBJECT_STORAGE_BUCKET: fraudlens-evidence
      CLAMAV_ENABLED: "true"
      CLAMAV_REQUIRED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
      minio: { condition: service_started }
      clamav: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  evidence-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "fraudlens.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://fraudlens:fraudlens@postgres:5432/fraudlens
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROCESSING_INLINE: "false"
      OBJECT_STORAGE_BACKEND: minio
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: fraudlens
      OBJECT_STORAGE_SECRET_KEY: fraudlens-dev-password
      OBJECT_STORAGE_BUCKET: fraudlens-evidence
      CLAMAV_ENABLED: "true"
      CLAMAV_REQUIRED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      api: { condition: service_healthy }
      kafka: { condition: service_started }

  retention-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "fraudlens.retention"]
    environment:
      DATABASE_URL: postgresql+asyncpg://fraudlens:fraudlens@postgres:5432/fraudlens
      OBJECT_STORAGE_BACKEND: minio
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: fraudlens
      OBJECT_STORAGE_SECRET_KEY: fraudlens-dev-password
      OBJECT_STORAGE_BUCKET: fraudlens-evidence
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      FRAUDLENS_API_URL: http://api:8000/api/v1
      FRAUDLENS_API_KEY: ${API_KEY:-fraudlens-compose-dev-key}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
